name: Daily ArXiv Update

on:
  schedule:
    # 每天 UTC 00:02 运行（台北/北京时间 08:02）
    - cron: '2 0 * * *'
  push:
    branches:
      - main  # 当你推送代码到 main 分支时自动触发
    paths-ignore:
      - 'docs/**'  # 忽略所有生成的文档变动，防止推送触发无限循环
  workflow_dispatch: # 允许手动点按钮触发

permissions:
  contents: write

concurrency:
  group: arxiv-daily-main
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # 必须获取全量 commit 以便推送

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Regression Tests
        run: python -m unittest discover -s tests -v

      - name: Configure Git
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'

      - name: Run ATel Task
        id: atel
        continue-on-error: true
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        env:
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_BASE_URL: ${{ secrets.OPENAI_BASE_URL }}
        run: |
          python scripts/main.py --task atel

      - name: Commit and Push ATel Changes
        if: steps.atel.outcome == 'success'
        run: |
          git add docs/atels docs/index.md
          if ! git diff --staged --quiet; then
            git commit -m "Auto-update: ATel content [skip ci]"
            git push origin main
          fi

      - name: Clean Failed ATel Changes
        if: steps.atel.outcome == 'failure'
        run: git restore --staged --worktree -- docs/atels docs/index.md

      - name: Run arXiv Task
        id: arxiv
        continue-on-error: true
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        env:
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_BASE_URL: ${{ secrets.OPENAI_BASE_URL }}
        run: |
          python scripts/main.py --task arxiv

      - name: Commit and Push arXiv Changes
        if: steps.arxiv.outcome == 'success'
        run: |
          git add docs/posts docs/index.md
          if ! git diff --staged --quiet; then
            git commit -m "Auto-update: arXiv content [skip ci]"
            git push origin main
          fi

      - name: Clean Failed arXiv Changes
        if: steps.arxiv.outcome == 'failure'
        run: git restore --staged --worktree -- docs/posts docs/index.md

      - name: Deploy to GitHub Pages
        if: >-
          always() &&
          (github.event_name == 'push' ||
           steps.atel.outcome == 'success' ||
           steps.arxiv.outcome == 'success')
        run: |
          mkdocs gh-deploy --force

      - name: Report Task Failure
        if: >-
          always() &&
          (steps.atel.outcome == 'failure' ||
           steps.arxiv.outcome == 'failure')
        run: exit 1
